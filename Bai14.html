<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Tính chỉ số BMI</h2>

    <label for="height">Nhập chiều cao (m):</label>
    <input type="number" id="height" placeholder="Ví dụ: 1.7">

    <br><br>

    <label for="weight">Nhập cân nặng (kg):</label>
    <input type="number" id="weight" placeholder="Ví dụ: 60">

    <br><br>

    <button onclick="checkBMI()">Tính BMI</button>

    <p id="result"></p>

    <script>
        function checkBMI() {
            let height = Number(document.getElementById("height").value);
            let weight = Number(document.getElementById("weight").value);
            let result = document.getElementById("result");

            if (
                document.getElementById("height").value === "" ||
                document.getElementById("weight").value === "" ||
                height <= 0 ||
                weight <= 0
            ) {
                result.innerHTML = "Vui lòng nhập chiều cao và cân nặng hợp lệ!";
            } else {
                let bmi = weight / (height * height);
                bmi = bmi.toFixed(2);

                let conclusion;

                if (bmi < 18.5) {
                    conclusion = "Gầy";
                } else if (bmi < 25) {
                    conclusion = "Bình thường";
                } else if (bmi < 30) {
                    conclusion = "Thừa cân";
                } else {
                    conclusion = "Béo phì";
                }

                result.innerHTML =
                    "Chỉ số BMI: " + bmi +
                    "<br>Kết luận: " + conclusion;
            }
        }
    </script>
</body>
</html>
