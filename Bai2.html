<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Chương trình tính tuổi</h2>
    <label for="birthYear">Nhập năm sinh:</label>
    <input type="number" id="birthYear" placeholder="Nhập năm sinh">
    <br><br>
    <button onclick="calculateAge()">Tinh tuoi</button>
    <p id="ketqua"></p>
    <script>
        function calculateAge() {
            let birthYear = document.getElementById("birthYear").value;
            let currentYear = 2026                                               ;
            let age = currentYear - birthYear;
            document.getElementById("ketqua").innerText = "Tuổi của bạn là: " + age;
        }
    </script>
</body>
</html>
