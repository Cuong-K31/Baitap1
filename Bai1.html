<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Nhập số nguyên</h2>
    <label for="numberInput">Nhập số nguyên:</label>
    <input type="number" id="numberInput" placeholder="Nhập số nguyên">
    <br><br>
    <button onclick="checkEvenOdd()">Kiểm tra chẵn lẻ</button>
    <p id="result"></p>
    <script>
        function checkEvenOdd() {
            let number = document.getElementById("numberInput").value;
            if (number % 2 === 0) {
                document.getElementById("result").innerText = "Số " + number + " là số chẵn.";
            } else {
                document.getElementById("result").innerText = "Số " + number + " là số lẻ.";
            }
        }
    </script>
</body>
</html>
