<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Lắc xúc xắc</h2>
    <button onclick="rollDice()">Lắc xúc xắc</button>
    <p id="result"></p>
    <script>
        function rollDice() {
            let dice = Math.floor(Math.random() * 6) + 1;
            document.getElementById("result").innerText = "Kết quả: " + dice;
        }
    </script>
</body>
</html>
