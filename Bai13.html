<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Chuyển đổi nhiệt độ</h2>

    <label for="celsius">Nhập nhiệt độ (°C):</label>
    <input type="number" id="celsius" placeholder="Nhập độ C">

    <br><br>

    <button onclick="convertTemperature()">Chuyển đổi</button>

    <p id="result"></p>

    <script>
        function convertTemperature() {
            let celsius = document.getElementById("celsius").value;
            let result = document.getElementById("result");

            if (celsius === "") {
                result.innerHTML = "Vui lòng nhập nhiệt độ!";
            } else {
                celsius = Number(celsius);

                let fahrenheit = (9 / 5) * celsius + 32;

                result.innerHTML =
                    "Nhiệt độ Fahrenheit: " +
                    fahrenheit.toFixed(2) + " °F";
            }
        }
    </script>
</body>
</html>
