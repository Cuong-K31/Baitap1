<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Rock Paper Scissors</h2>
    <label for="userChoice">Chọn (rock, paper, scissors):</label>
    <input type="text" id="userChoice" placeholder="Nhập lựa chọn của bạn">
    <br><br>
    <button onclick="playGame()">Chơi</button>
    <p id="result"></p>
    <script>
        function playGame() {
            let choices = ["rock", "paper", "scissors"];
            let userChoice = document.getElementById("userChoice").value.toLowerCase();
            let computerChoice = choices[Math.floor(Math.random() * choices.length)];

            let result;
            if (userChoice === computerChoice) {
                result = "Hòa! Cả hai chọn " + userChoice;
            } else if (
                (userChoice === "rock" && computerChoice === "scissors") ||
                (userChoice === "paper" && computerChoice === "rock") ||
                (userChoice === "scissors" && computerChoice === "paper")
            ) {
                result = "Bạn thắng! Bạn chọn " + userChoice + ", máy chọn " + computerChoice;
            } else {
                result = "Bạn thua! Bạn chọn " + userChoice + ", máy chọn " + computerChoice;
            }

            document.getElementById("result").innerText = result;
        }
    </script>
</body>
</html>
