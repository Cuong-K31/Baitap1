<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Kiểm tra mật khẩu</h2>

    <label for="passwordInput">Nhập mật khẩu:</label>
    <input type="password" id="passwordInput" placeholder="Nhập mật khẩu">

    <br><br>

    <button onclick="checkPassword()">Kiểm tra mật khẩu</button>

    <p id="result"></p>

    <script>
        function checkPassword() {
            let password = document.getElementById("passwordInput").value;
            let result = document.getElementById("result");

            if (password === "") {
                result.innerHTML = "Vui lòng nhập mật khẩu!";
            } else if (password.length < 8) {
                result.innerHTML = "Mật khẩu phải có ít nhất 8 ký tự!";
            } else {
                result.innerHTML = "Mật khẩu hợp lệ!";
            }
        }
    </script>
</body>
</html>
